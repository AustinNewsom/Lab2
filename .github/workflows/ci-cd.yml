name: Simple CI/CD Workflow

# Trigger the workflow whenever code is pushed to main
on:
  push:
    branches:
      - main

jobs:

  # Job 1: Build/test the project
  build:
    runs-on: ubuntu-latest

    steps:
      # Download the repository onto the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Simple validation step
      - name: Validate index.html
        run: |
          test -f index.html
          echo "Build OK - index.html exists"

  # Job 2: Deploy after build succeeds
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: echo "Deployment successful to staging"

  # Job 3: Upload index.html after build succeeds
  upload-artifact:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload webpage artifact
        uses: actions/upload-artifact@v4
        with:
          name: webpage
          path: index.html
